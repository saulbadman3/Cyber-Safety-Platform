[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cyber-check-api"
version = "0.1.0"
description = "Cyber Check Ukrainian small-business security self-audit API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]
[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<11",
  "ruff>=0.8,<1",
]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["seed/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
